<html>
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container">

    <ul class="nav nav-tabs">
      <li class="active">
        <a href="#decode" data-toggle="tab">Decode</a>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane active" id="decode">

        <h2>Decode image</h2>

        <p class="alert alert-info">
          To decode a hidden message from an image, just choose an image and hit the Decode button.
        </p>

        <form class="form">
          <div class="form-group">
            <input class="form-control" type="file" onchange="previewDecodeImage()">
          </div>

          <div class="form-group">
            <button class="btn btn-default pull-right" onclick="decodeMessage()">Decode</button>
          </div>
        </form>

        <div class="binary-decode" style="display:none;">
          <h3>Hidden message</h3>
          <textarea class="form-control"></textarea>
        </div>

        <div class="decode" style="display:none;">
          <h3>Input</h3>
          <canvas></canvas>
        </div>

      </div>
    </div>

  </div>
</body>

</html>
